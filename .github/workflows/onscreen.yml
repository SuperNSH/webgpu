name: On screen

# `<Canvas>` in a real window: examples/canvas-apple (the reference's Triangle
# and rotating Cube) with `nsh run` on each desktop, checked by screenshot
# (scripts/onscreen.py). Software GPUs on Linux (lavapipe) and Windows (WARP),
# the runner's paravirtualized one on macOS. Then the gallery, the same way,
# with `nsh test --target`. The screenshots are the artifacts.

on:
  push:
    branches: [master, "ci/**"]
  workflow_dispatch:

concurrency:
  group: onscreen-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NSH_VERSION: 0.7.1

jobs:
  desktop:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos, os: macos-latest }
          - { target: linux, os: ubuntu-24.04 }
          - { target: windows, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GTK 4, Mesa's software drivers and an X server
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libclang-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libzstd-dev libssl-dev libasound2-dev \
            libvulkan1 mesa-vulkan-drivers libegl1 libgl1-mesa-dri xvfb openbox adwaita-icon-theme
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            examples/canvas-apple/native
            examples/gallery/native
          key: onscreen
      - run: echo "NSH_HOME=$(cd "$RUNNER_TEMP" && pwd)/nsh-home" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nsh-cli/bin
          key: nsh-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.NSH_VERSION }}
      - name: Install the CLI of NSH_VERSION
        run: |
          root="$(cd "$RUNNER_TEMP" && pwd)/nsh-cli"
          if [ ! -x "$root/bin/nsh" ] && [ ! -x "$root/bin/nsh.exe" ]; then
            cargo install --locked nsh-cli --version "$NSH_VERSION" --root "$root"
          fi
          echo "$root/bin" >> "$GITHUB_PATH"
          if [ "$RUNNER_OS" = Windows ]; then
            cygpath -w "$root/bin" >> "$GITHUB_PATH"
            echo "NSH_HOME=$(cygpath -w "$RUNNER_TEMP")\\nsh-home" >> "$GITHUB_ENV"
          fi
      - run: nsh --version
      - run: python3 -m pip install --break-system-packages pillow || python -m pip install pillow
      - name: macOS and Windows
        if: matrix.target != 'linux'
        run: |
          py=python3; [ "$RUNNER_OS" = Windows ] && py=python
          $py scripts/onscreen.py ${{ matrix.target }} examples/canvas-apple out
      - name: Linux, under Xvfb
        if: matrix.target == 'linux'
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c \
            'openbox & sleep 1; GDK_BACKEND=x11 dbus-run-session python3 scripts/onscreen.py linux examples/canvas-apple out'
      # The gallery: its tests (every demo draws, without GPU errors) and a
      # picture of the window on each page, in the platform's own host.
      - name: Gallery
        if: ${{ !cancelled() }}
        working-directory: examples/gallery
        run: |
          mkdir -p tour
          run() {
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run -a -s "-screen 0 1280x800x24" bash -c \
                'openbox & sleep 1; GDK_BACKEND=x11 dbus-run-session "$@"' _ "$@"
            else
              "$@"
            fi
          }
          code=0
          for file in gallery tour; do
            run nsh test --target ${{ matrix.target }} $file.test.tsx > tour/$file.log 2>&1 || code=1
            grep -v '^PNG' tour/$file.log | cut -c1-300 | tail -n 250
          done
          py=python3; [ "$RUNNER_OS" = Windows ] && py=python
          $py ../../scripts/blank.py tour || code=1
          exit $code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: onscreen-${{ matrix.target }}
          path: |
            out
            examples/gallery/tour
