[package]
name = "nsh-webgpu-audit-repro"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]

[dev-dependencies]
nsh-webgpu = { path = "../../../.." }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
wgpu = { version = "29", default-features = false, features = ["serde", "std", "parking_lot", "wgsl", "dx12", "metal", "vulkan", "gles"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "objc2-core-foundation", "objc2-core-graphics", "objc2-metal"] }
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFString"] }

[workspace]
